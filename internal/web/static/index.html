<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>golovebox</title>
<style>
[x-cloak]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* Chat */
#chat{width:380px;min-width:280px;display:flex;flex-direction:column;border-right:1px solid #1e293b;background:#1e293b}
#chat-header{padding:12px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:8px}
#chat-header h1{font-size:1rem;font-weight:600;color:#f8fafc}
.status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0}
.status-dot.red{background:#ef4444}
/* Health */
#health-panel{padding:8px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h-indicator{font-size:0.75rem;display:flex;align-items:center;gap:3px;cursor:default}
.h-dot{font-size:1rem;line-height:1;color:#9ca3af;transition:color .2s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.h-dot.checking{animation:pulse 1s infinite}
#health-refresh{margin-left:auto;background:none;border:none;color:#64748b;cursor:pointer;font-size:0.8rem;padding:2px 4px;border-radius:4px}
#health-refresh:hover{color:#e2e8f0;background:#334155}
/* Messages */
#messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:8px;font-size:0.8rem;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg.system{background:#0f172a;color:#94a3b8}
.msg.agent{background:#1e3a5f;color:#bfdbfe}
.msg.ok{background:#14532d;color:#86efac}
.msg.err{background:#450a0a;color:#fca5a5}
.msg.warn{background:#431407;color:#fed7aa}
.msg.task{background:#1c1f3a;border-left:2px solid #3b82f6;color:#bfdbfe;font-style:italic}
.msg-detail{font-size:0.7rem;color:#f87171;margin-top:4px;font-family:monospace}
/* Upload */
#upload-area{padding:12px;border-top:1px solid #334155}
#upload-area label{display:block;font-size:0.75rem;color:#94a3b8;margin-bottom:6px}
#drop-zone{border:2px dashed #334155;border-radius:8px;padding:16px;text-align:center;cursor:pointer;font-size:0.8rem;color:#64748b;transition:border-color .2s}
#drop-zone:hover,#drop-zone.drag{border-color:#3b82f6;color:#93c5fd}
.file-list{margin-top:6px;font-size:0.75rem;color:#64748b}
/* Task */
#task-area{padding:0 12px 12px}
#task-area label{display:block;font-size:0.75rem;color:#94a3b8;margin-bottom:4px}
.task-ta{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.8rem;padding:8px;resize:vertical;font-family:inherit}
.task-ta:focus{outline:none;border-color:#3b82f6}
.btn-primary{width:100%;margin-top:6px;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:500}
.btn-primary:hover{background:#1d4ed8}
.btn-primary:disabled{background:#334155;cursor:not-allowed;color:#64748b}
/* Runs */
#runs-panel{padding:12px;border-top:1px solid #334155;min-height:0}
#runs-panel h2{font-size:0.75rem;color:#94a3b8;margin-bottom:6px}
#runs-list{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto}
.run-item{padding:6px 8px;border-radius:6px;background:#0f172a;cursor:pointer;font-size:0.75rem}
.run-item:hover{background:#1e3a5f}
.run-item.active{border-left:2px solid #3b82f6}
.run-row{display:flex;justify-content:space-between;align-items:center}
.run-preview{font-size:0.65rem;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:2px 6px;border-radius:9999px;font-size:0.65rem;font-weight:600}
.badge.done{background:#14532d;color:#86efac}
.badge.running{background:#78350f;color:#fcd34d}
.badge.error{background:#450a0a;color:#fca5a5}
/* DAG */
#dag-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#dag-header{padding:10px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px;font-size:0.8rem;color:#94a3b8}
#run-label{font-weight:600;color:#e2e8f0}
.stop-btn{margin-left:auto;padding:4px 10px;background:#7f1d1d;color:#fca5a5;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem}
.stop-btn:hover{background:#991b1b}
#dag-canvas{flex:1;width:100%;background:#0a0f1e}
#canvas-tooltip{position:fixed;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:4px 8px;font-size:0.75rem;color:#e2e8f0;pointer-events:none;display:none;z-index:50;max-width:260px;word-break:break-all;white-space:pre-wrap}
/* Node panel */
#node-panel{position:absolute;top:0;right:0;bottom:0;width:340px;background:#1e293b;border-left:1px solid #334155;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
#node-panel.open{transform:translateX(0)}
.np-header{padding:10px 12px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:8px;font-size:0.8rem}
.np-title{font-weight:600;color:#e2e8f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-close{background:none;border:none;color:#64748b;cursor:pointer;font-size:1rem;padding:0 4px}
.np-close:hover{color:#e2e8f0}
.np-meta{padding:8px 10px;border-bottom:1px solid #1e293b;font-size:0.73rem;color:#64748b}
.np-meta strong{color:#94a3b8;display:block;margin-bottom:2px}
.np-meta-val{color:#bfdbfe;font-style:italic}
.np-error{margin:8px 10px;padding:8px;background:#450a0a;border-radius:6px;font-size:0.73rem;color:#fca5a5;font-family:monospace;white-space:pre-wrap;word-break:break-all}
#node-log{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:0.75rem}
.log-entry{background:#0f172a;border-radius:6px;padding:8px;border-left:2px solid #334155}
.log-hdr{color:#64748b;margin-bottom:4px;font-size:0.7rem;display:flex;justify-content:space-between}
.log-param{color:#93c5fd;font-family:monospace;white-space:pre-wrap;word-break:break-all;margin-bottom:2px}
.log-obs{color:#a3e635;font-family:monospace;white-space:pre-wrap;word-break:break-all}
/* Checkpoint */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
#cp-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;min-width:360px;z-index:100;box-shadow:0 25px 50px rgba(0,0,0,.5)}
#cp-dialog h3{font-size:0.95rem;margin-bottom:8px;color:#f8fafc}
#cp-dialog p{font-size:0.8rem;color:#94a3b8;margin-bottom:16px}
.cp-btns{display:flex;gap:8px}
.cp-approve{flex:1;padding:8px;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:500}
.cp-reject{flex:1;padding:8px;background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:500}
.cp-reason{width:100%;padding:6px 8px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.8rem;margin-bottom:8px}
</style>

<script>
document.addEventListener('alpine:init', () => {

  // ── Shared stores ────────────────────────────────────────
  Alpine.store('session', {
    runId:   null,
    running: false,
    connOk:  true,
  });

  Alpine.store('dag', {
    data:  null,   // raw DAG {nodes, edges}
    nodes: {},     // nodeId → {state, error, iterCount}
    reset() {
      this.data  = null;
      this.nodes = {};
    },
    update(id, state, error) {
      this.nodes = {
        ...this.nodes,
        [id]: { ...(this.nodes[id] || {}), state, error: error || '' },
      };
    },
    setIter(id, iter) {
      this.nodes = {
        ...this.nodes,
        [id]: { ...(this.nodes[id] || {}), iterCount: iter },
      };
    },
  });

  // ── healthPanel ──────────────────────────────────────────
  Alpine.data('healthPanel', () => ({
    loading: false,
    checks: {
      vm:     { ok: null, msg: '' },
      llm:    { ok: null, msg: '' },
      github: { ok: null, msg: '' },
      repo:   { ok: null, msg: '' },
    },
    async check() {
      this.loading = true;
      try {
        const data = await fetch('/api/health').then(r => r.json());
        this.checks = data;
      } catch(e) {
        ['vm','llm','github','repo'].forEach(k => {
          this.checks[k] = { ok: false, msg: 'erro: ' + e.message };
        });
      } finally {
        this.loading = false;
      }
    },
    color(key) {
      if (this.loading || this.checks[key].ok === null) return '#9ca3af';
      return this.checks[key].ok ? '#34d399' : '#f87171';
    },
    init() { this.check(); },
  }));

  // ── chatPanel ────────────────────────────────────────────
  Alpine.data('chatPanel', () => ({
    messages: [],
    task:     '',
    files:    [],
    dragging: false,
    running:  false,

    get fileNames() {
      return this.files.map(f => f.name).join(', ') || 'Nenhum arquivo .md selecionado';
    },

    addMsg(text, type = 'system', detail = '') {
      this.messages.push({ id: Date.now() + Math.random(), text, type, detail });
      this.$nextTick(() => {
        const el = this.$refs.log;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    handleDrop(e) {
      this.dragging = false;
      this.files = [...e.dataTransfer.files].filter(f => f.name.endsWith('.md'));
    },
    handleFileChange(e) {
      this.files = [...e.target.files].filter(f => f.name.endsWith('.md'));
    },

    async submitFiles() {
      if (!this.files.length || this.running) return;
      this.running = true;
      Alpine.store('session').running = true;
      this.addMsg(`Enviando ${this.files.length} spec(s)...`);
      const form = new FormData();
      this.files.forEach(f => form.append('spec', f, f.name));
      try {
        const r = await fetch('/api/run', { method: 'POST', body: form });
        if (!r.ok) throw new Error(await r.text());
        const { run_id } = await r.json();
        this.addMsg(`Run iniciada: ${run_id}`, 'ok');
        this.files = [];
        this._startRun(run_id);
      } catch(e) {
        this.addMsg(`Erro: ${e.message}`, 'err');
        this.running = false;
        Alpine.store('session').running = false;
      }
    },

    async execute() {
      const task = this.task.trim();
      if (!task || this.running) return;
      this.running = true;
      Alpine.store('session').running = true;
      this.addMsg('Enviando tarefa...', 'system');
      try {
        const r = await fetch('/api/run', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ task }),
        });
        if (!r.ok) throw new Error(await r.text());
        const { run_id } = await r.json();
        this.addMsg(`Run iniciada: ${run_id}`, 'ok');
        this.addMsg(`📋 "${task}"`, 'task');
        this.task = '';
        this._startRun(run_id);
      } catch(e) {
        this.addMsg(`Erro: ${e.message}`, 'err');
        this.running = false;
        Alpine.store('session').running = false;
      }
    },

    async stop() {
      const runId = Alpine.store('session').runId;
      if (!runId) return;
      try {
        await fetch(`/api/runs/${runId}/stop`, { method: 'POST' });
        this.addMsg(`Run cancelada: ${runId}`, 'warn');
      } catch(e) {
        this.addMsg(`Erro ao parar: ${e.message}`, 'err');
      }
    },

    _startRun(runId) {
      Alpine.store('session').runId = runId;
      localStorage.setItem('glb_run_id', runId);
      window.dispatchEvent(new CustomEvent('run-started', { detail: { runId } }));
      selectRunGlobal(runId);
    },

    // Called by run-selected event (user clicks run in list)
    onRunSelected(runId) {
      Alpine.store('session').runId = runId;
      localStorage.setItem('glb_run_id', runId);
      selectRunGlobal(runId);
    },

    // Called by sse-state-change event
    onStateChange(data) {
      const state = data.state || '';
      if (!state) return;
      if (state === 'error') {
        this.addMsg(`[error] ${data.id}`, 'err', data.error || '');
      } else {
        const typeMap = { done:'ok', waiting_human:'warn', running:'agent', pending:'agent', error:'err' };
        this.addMsg(`[${state}] ${data.id}`, typeMap[state] || 'system');
      }
      // Sync running state from dag store
      const nodes = Alpine.store('dag').nodes;
      const busy = Object.values(nodes).some(n => n.state === 'running' || n.state === 'pending');
      this.running = busy;
      Alpine.store('session').running = busy;
    },

    async init() {
      try {
        const r = await fetch('/api/status');
        Alpine.store('session').connOk = r.ok;
      } catch(_) { Alpine.store('session').connOk = false; }

      this.addMsg('Bem-vindo ao golovebox. Faça upload de arquivos .md ou digite uma tarefa para iniciar.');

      const savedRunId = localStorage.getItem('glb_run_id');
      if (savedRunId) {
        Alpine.store('session').runId = savedRunId;
        await selectRunGlobal(savedRunId);
        const savedNodeId = localStorage.getItem('glb_node_id');
        if (savedNodeId) {
          window.dispatchEvent(new CustomEvent('node-selected', {
            detail: { runId: savedRunId, nodeId: savedNodeId }
          }));
        }
      }
    },
  }));

  // ── runList ──────────────────────────────────────────────
  Alpine.data('runList', () => ({
    runs: [],
    async load() {
      try {
        const data = await fetch('/api/runs').then(r => r.json());
        this.runs = data || [];
      } catch(_) {}
    },
    select(runId) {
      window.dispatchEvent(new CustomEvent('run-selected', { detail: { runId } }));
    },
    badgeClass(state) {
      return 'badge ' + (state || 'system');
    },
    isActive(runId) {
      return runId === Alpine.store('session').runId;
    },
    init() { this.load(); },
  }));

  // ── nodePanel ────────────────────────────────────────────
  Alpine.data('nodePanel', () => ({
    open:     false,
    nodeId:   null,
    runId:    null,
    entries:  [],
    runTask:  '',
    nodeDesc: '',
    nodeError:'',

    async openFor(runId, nodeId) {
      this.runId   = runId;
      this.nodeId  = nodeId;
      this.open    = true;
      this.entries = [];
      this.runTask = '';
      this.nodeDesc= '';
      this.nodeError = '';
      localStorage.setItem('glb_node_id', nodeId);

      try {
        const [logData, runData] = await Promise.all([
          fetch(`/api/runs/${runId}/nodes/${nodeId}/log`).then(r => r.json()),
          fetch(`/api/runs/${runId}`).then(r => r.json()),
        ]);
        this.entries  = logData || [];
        this.runTask  = runData.task || '';
        // Node description from DAG
        const dagStore = Alpine.store('dag');
        const node = dagStore.data && dagStore.data.nodes && dagStore.data.nodes[nodeId];
        this.nodeDesc  = (node && (node.annotation || node.task)) || '';
        this.nodeError = (dagStore.nodes[nodeId] && dagStore.nodes[nodeId].error) || '';
        this._scrollLog();
      } catch(_) {}
    },

    close() {
      this.open   = false;
      this.nodeId = null;
      localStorage.removeItem('glb_node_id');
    },

    onNodeLog(nodeId, entry) {
      if (nodeId !== this.nodeId) return;
      this.entries.push(entry);
      this._scrollLog();
    },

    fmtTime(ts) {
      return ts ? new Date(ts).toLocaleTimeString() : '';
    },

    _scrollLog() {
      this.$nextTick(() => {
        const el = this.$refs.logEntries;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
  }));

  // ── checkpointDialog ─────────────────────────────────────
  Alpine.data('checkpointDialog', () => ({
    open:       false,
    runId:      null,
    nodeId:     null,
    annotation: '',
    reason:     '',

    openFor(runId, nodeId, annotation) {
      this.runId      = runId;
      this.nodeId     = nodeId;
      this.annotation = annotation;
      this.reason     = '';
      this.open       = true;
    },
    close() { this.open = false; },
    async approve() {
      if (!this.runId) return;
      this.close();
      await fetch(`/api/runs/${this.runId}/approve/${this.nodeId}`, { method: 'POST' });
      window.dispatchEvent(new CustomEvent('cp-result', { detail: { nodeId: this.nodeId, approved: true } }));
    },
    async reject() {
      if (!this.runId) return;
      const reason = this.reason.trim() || 'rejeitado pelo usuário';
      this.close();
      await fetch(`/api/runs/${this.runId}/reject/${this.nodeId}`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ reason }),
      });
      window.dispatchEvent(new CustomEvent('cp-result', { detail: { nodeId: this.nodeId, approved: false } }));
    },
  }));

}); // end alpine:init
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ── Left: Chat ─────────────────────────────────────── -->
  <aside id="chat"
         x-data="chatPanel"
         @run-selected.window="onRunSelected($event.detail.runId)"
         @sse-state-change.window="onStateChange($event.detail)"
         @cp-result.window="addMsg($event.detail.approved ? 'Aprovado: '+$event.detail.nodeId : 'Rejeitado: '+$event.detail.nodeId, $event.detail.approved ? 'ok' : 'err')">

    <div id="chat-header">
      <div class="status-dot" :class="{red: !$store.session.connOk}"></div>
      <h1>golovebox</h1>
    </div>

    <!-- Health -->
    <div id="health-panel" x-data="healthPanel">
      <template x-for="key in ['vm','llm','github','repo']" :key="key">
        <div class="h-indicator">
          <span class="h-dot"
                :class="{checking: loading}"
                :style="'color:' + color(key)"
                :title="checks[key] ? checks[key].msg : ''"
                >●</span>
          <span x-text="key.toUpperCase()"></span>
        </div>
      </template>
      <button id="health-refresh" @click="check()" title="Verificar health">↻</button>
    </div>

    <!-- Messages -->
    <div id="messages" x-ref="log">
      <template x-for="m in messages" :key="m.id">
        <div :class="'msg ' + m.type">
          <span x-text="m.text"></span>
          <div x-show="m.detail" class="msg-detail" x-text="m.detail"></div>
        </div>
      </template>
    </div>

    <!-- File upload -->
    <div id="upload-area">
      <label>Spec files (.md)</label>
      <div id="drop-zone"
           :class="{drag: dragging}"
           @click="$refs.fileInput.click()"
           @dragover.prevent="dragging=true"
           @dragleave.prevent="dragging=false"
           @drop.prevent="handleDrop($event)">
        Clique ou arraste arquivos .md aqui
      </div>
      <input type="file" x-ref="fileInput" multiple accept=".md"
             @change="handleFileChange($event)" style="display:none">
      <div class="file-list" x-text="fileNames"></div>
      <button class="btn-primary"
              @click="submitFiles()"
              :disabled="files.length === 0 || running">▶ Executar specs</button>
    </div>

    <!-- Manual task -->
    <div id="task-area">
      <label>ou digite a tarefa:</label>
      <textarea class="task-ta" x-model="task" rows="5"
                placeholder="Implemente o endpoint POST /api/users com validação de email..."
                @keydown.ctrl.enter="execute()"></textarea>
      <button class="btn-primary"
              @click="execute()"
              :disabled="!task.trim() || running">▶ Executar</button>
    </div>

    <!-- Runs list -->
    <div id="runs-panel"
         x-data="runList"
         @run-started.window="load()"
         @run-selected.window="load()">
      <h2>Runs anteriores</h2>
      <div id="runs-list">
        <template x-for="r in runs" :key="r.id">
          <div class="run-item"
               :class="{active: isActive(r.id)}"
               @click="select(r.id)">
            <div class="run-row">
              <span x-text="r.id"></span>
              <span :class="badgeClass(r.state)" x-text="r.state"></span>
            </div>
            <div class="run-preview" x-show="r.task" x-text="'\"' + r.task + '\"'"></div>
          </div>
        </template>
      </div>
    </div>

  </aside>

  <!-- ── Right: DAG ─────────────────────────────────────── -->
  <main id="dag-panel">
    <div id="dag-header">
      <span>DAG</span>
      <span id="run-label" x-text="$store.session.runId || ''" x-data></span>
      <button class="stop-btn"
              x-show="$store.session.running"
              x-cloak
              x-data
              @click="window.dispatchEvent(new CustomEvent('stop-run'))">⏹ Parar run</button>
    </div>
    <canvas id="dag-canvas"></canvas>
    <div id="canvas-tooltip"></div>

    <!-- Node log panel -->
    <div id="node-panel"
         x-data="nodePanel"
         :class="{open: open}"
         @node-selected.window="openFor($event.detail.runId, $event.detail.nodeId)"
         @sse-node-log.window="onNodeLog($event.detail.nodeId, $event.detail.entry)">

      <div class="np-header">
        <span class="np-title" x-text="'node: ' + (nodeId || '')"></span>
        <button class="np-close" @click="close()">×</button>
      </div>

      <div class="np-meta">
        <div x-show="runTask">
          <strong>Objetivo do run:</strong>
          <span class="np-meta-val" x-text="runTask"></span>
        </div>
        <div x-show="nodeDesc" style="margin-top:6px">
          <strong>Descrição do node:</strong>
          <span class="np-meta-val" x-text="nodeDesc"></span>
        </div>
      </div>

      <div class="np-error" x-show="nodeError" x-text="'✗ Erro:\n' + nodeError"></div>

      <div id="node-log" x-ref="logEntries">
        <template x-for="(e, i) in entries" :key="i">
          <div class="log-entry">
            <div class="log-hdr">
              <span x-text="'iter ' + e.iter + ' — ' + e.action"></span>
              <span x-text="fmtTime(e.ts)"></span>
            </div>
            <div class="log-param" x-show="e.params" x-text="'▶ ' + (e.params || e.action)"></div>
            <div class="log-obs" x-text="'◀ ' + (e.obs || '')"></div>
          </div>
        </template>
      </div>

    </div>
  </main>
</div>

<!-- Checkpoint dialog -->
<div x-data="checkpointDialog"
     @sse-checkpoint.window="openFor($event.detail.runId, $event.detail.nodeId, $event.detail.annotation)">
  <div id="overlay" x-cloak x-show="open" @click="close()"></div>
  <div id="cp-dialog" x-cloak x-show="open">
    <h3 x-text="'Checkpoint: ' + (nodeId || '')"></h3>
    <p x-text="annotation"></p>
    <input class="cp-reason" type="text" x-model="reason" placeholder="Motivo da rejeição (opcional)">
    <div class="cp-btns">
      <button class="cp-approve" @click="approve()">✓ Aprovar</button>
      <button class="cp-reject"  @click="reject()">✗ Rejeitar</button>
    </div>
  </div>
</div>

<script>
// ── Vanilla JS: global SSE + Canvas2D ─────────────────────
// These live outside Alpine because Canvas2D is imperative by nature,
// and EventSource is a long-lived global resource.

const NODE_W = 160, NODE_H = 48;
const COLORS = {
  pending:'#4b5563', running:'#b45309', done:'#15803d',
  error:'#b91c1c', waiting_human:'#c2410c',
};
const TEXT_COLORS = {
  pending:'#d1d5db', running:'#fef3c7', done:'#bbf7d0',
  error:'#fecaca', waiting_human:'#fed7aa',
};

let currentRunId = null;
let clickAreas   = [];
const canvas  = document.getElementById('dag-canvas');
const tooltip = document.getElementById('canvas-tooltip');

// ── selectRunGlobal — called by chatPanel and init ─────────
async function selectRunGlobal(runId) {
  currentRunId = runId;
  Alpine.store('dag').reset();
  connectSSE(runId);

  try {
    const data = await fetch(`/api/runs/${runId}`).then(r => r.json());
    Alpine.store('dag').data = data.dag;

    // Seed node states from persisted node_states.json
    const ns = data.node_states || {};
    for (const [id, s] of Object.entries(ns)) {
      const state = typeof s === 'string' ? s : s.state;
      const error = typeof s === 'object' ? (s.error || '') : '';
      Alpine.store('dag').update(id, state, error);
    }
    drawDAG();
  } catch(_) {}
}

// ── SSE ────────────────────────────────────────────────────
function connectSSE(runId) {
  if (window._sse) { window._sse.close(); window._sse = null; }
  const es = new EventSource(`/api/runs/${runId}/stream`);
  window._sse = es;

  es.onopen  = () => { Alpine.store('session').connOk = true; };
  es.onerror = () => { Alpine.store('session').connOk = false; };

  es.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch(_) { return; }

    if (data.type === 'node_log') {
      Alpine.store('dag').setIter(data.node_id, data.iter);
      drawDAG();
      window.dispatchEvent(new CustomEvent('sse-node-log', {
        detail: { nodeId: data.node_id, entry: data },
      }));
      return;
    }

    // Node state change (no type field, has id)
    if (!data.id) return;
    Alpine.store('dag').update(data.id, data.state, data.error || '');
    window.dispatchEvent(new CustomEvent('sse-state-change', { detail: data }));
    drawDAG();

    if (data.state === 'waiting_human') {
      window.dispatchEvent(new CustomEvent('sse-checkpoint', {
        detail: { runId: currentRunId, nodeId: data.id, annotation: data.annotation || data.id },
      }));
    }
  };
}

// stop-run event from the DAG header button
window.addEventListener('stop-run', async () => {
  const runId = Alpine.store('session').runId;
  if (!runId) return;
  try {
    await fetch(`/api/runs/${runId}/stop`, { method: 'POST' });
  } catch(_) {}
});

// ── Canvas: drawDAG ────────────────────────────────────────
function drawDAG() {
  const ctx = canvas.getContext('2d');
  canvas.width  = canvas.offsetWidth  || 800;
  canvas.height = canvas.offsetHeight || 600;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const dagStore = Alpine.store('dag');
  const dagData  = dagStore.data;
  if (!dagData || !dagData.nodes) return;

  const nodes = Object.values(dagData.nodes);
  if (!nodes.length) return;

  const layers = computeLayers(dagData);
  const layerCount = Object.keys(layers).length;
  if (!layerCount) return;

  const totalW = canvas.width, totalH = canvas.height;
  const dagW = Math.max(...Object.values(layers).map(l => l.length)) * (NODE_W + 40) - 40;
  const dagH = layerCount * (NODE_H + 60) - 60;
  const offsetX = Math.max(0, (totalW - dagW) / 2);
  const offsetY = Math.max(20, (totalH - dagH) / 2);

  const positions = {};
  Object.entries(layers).forEach(([depth, ids]) => {
    const d = parseInt(depth);
    const rowW = ids.length * NODE_W + (ids.length - 1) * 40;
    const rowX = offsetX + (dagW - rowW) / 2;
    const y    = offsetY + d * (NODE_H + 60);
    ids.forEach((id, i) => { positions[id] = { x: rowX + i * (NODE_W + 40), y }; });
  });

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  (dagData.edges || []).forEach(([from, to]) => {
    const pf = positions[from], pt = positions[to];
    if (!pf || !pt) return;
    const fx = pf.x + NODE_W / 2, fy = pf.y + NODE_H;
    const tx = pt.x + NODE_W / 2, ty = pt.y;
    const my = (fy + ty) / 2;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.bezierCurveTo(fx, my, tx, my, tx, ty);
    ctx.stroke();
    ctx.fillStyle = '#334155';
    drawArrow(ctx, tx, ty, tx, fy);
  });

  clickAreas = [];
  nodes.forEach(n => {
    const p = positions[n.id];
    if (!p) return;
    const ns    = dagStore.nodes[n.id] || {};
    const state = ns.state || n.state || 'pending';
    const bg    = COLORS[state]      || COLORS.pending;
    const fg    = TEXT_COLORS[state] || TEXT_COLORS.pending;

    if (state === 'waiting_human') {
      ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2;
      ctx.beginPath();
      roundRect(ctx, p.x - 4, p.y - 4, NODE_W + 8, NODE_H + 8, 10);
      ctx.stroke();
    }

    ctx.fillStyle = bg;
    ctx.beginPath();
    roundRect(ctx, p.x, p.y, NODE_W, NODE_H, 8);
    ctx.fill();

    ctx.fillStyle = fg;
    ctx.font = '11px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(trunc(n.id, 18), p.x + NODE_W / 2, p.y + NODE_H / 2 - 8);

    ctx.font = '9px system-ui,sans-serif';
    ctx.fillStyle = fg + 'aa';
    let sub = state;
    if (state === 'running' && ns.iterCount) sub = `running [${ns.iterCount}/20]`;
    ctx.fillText(sub, p.x + NODE_W / 2, p.y + NODE_H / 2 + 8);

    clickAreas.push({
      x: p.x, y: p.y, w: NODE_W, h: NODE_H,
      nodeId: n.id,
      isCheckpoint: state === 'waiting_human',
      annotation: n.annotation || n.id,
      error: ns.error || '',
    });
  });
}

canvas.addEventListener('click', e => {
  if (!currentRunId) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (const a of clickAreas) {
    if (mx >= a.x && mx <= a.x + a.w && my >= a.y && my <= a.y + a.h) {
      if (a.isCheckpoint) {
        window.dispatchEvent(new CustomEvent('sse-checkpoint', {
          detail: { runId: currentRunId, nodeId: a.nodeId, annotation: a.annotation },
        }));
      } else {
        window.dispatchEvent(new CustomEvent('node-selected', {
          detail: { runId: currentRunId, nodeId: a.nodeId },
        }));
      }
      return;
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const found = clickAreas.find(a => mx >= a.x && mx <= a.x + a.w && my >= a.y && my <= a.y + a.h);
  if (found) {
    tooltip.textContent = found.nodeId + (found.error ? '\n✗ ' + found.error.slice(0, 80) : '');
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY + 14) + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
window.addEventListener('resize', drawDAG);

// ── Canvas helpers ─────────────────────────────────────────
function computeLayers(dag) {
  const depth = {};
  Object.keys(dag.nodes || {}).forEach(id => { depth[id] = 0; });
  const edges = dag.edges || [];
  for (let i = 0; i < Object.keys(depth).length; i++) {
    edges.forEach(([f, t]) => {
      if ((depth[f] || 0) + 1 > (depth[t] || 0)) depth[t] = depth[f] + 1;
    });
  }
  const layers = {};
  Object.entries(depth).forEach(([id, d]) => {
    (layers[d] = layers[d] || []).push(id);
  });
  return layers;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawArrow(ctx, x, y, fx, fy) {
  const a = Math.atan2(y - fy, x - fx), s = 6;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - s * Math.cos(a - 0.4), y - s * Math.sin(a - 0.4));
  ctx.lineTo(x - s * Math.cos(a + 0.4), y - s * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
}

function trunc(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
</script>
</body>
</html>
